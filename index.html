<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>Mis Pagos</title>
<link rel="manifest" href="/mis-pagos/manifest.json">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f1117; height: 100vh; display: flex; flex-direction: column; }
  iframe {
    flex: 1;
    border: none;
    width: 100%;
    height: 100%;
  }
  #loading {
    position: fixed;
    inset: 0;
    background: #0f1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #e8e8e8;
    font-family: system-ui, sans-serif;
    z-index: 999;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #2a2a3a;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <span>Cargando...</span>
</div>

<iframe
  id="app"
  src="https://script.google.com/macros/s/AKfycbzFvOROoSlSMZNQRwdFQrvjpW6Uku-arwT3QVUGHuy7lC4OpOZcMOSRNC2vuv6nXHxZ/exec"
  onload="document.getElementById('loading').style.display='none'"
  allow="storage-access"
></iframe>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/mis-pagos/sw.js');
  }

  // Evitar que el botón atrás salga de la app
  history.pushState(null, null, location.href);
  window.addEventListener('popstate', () => history.pushState(null, null, location.href));
</script>
</body>
</html>
